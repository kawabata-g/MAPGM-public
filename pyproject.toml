[project]
name = "mapgm"
version = "0.1.0"
description = "Multi-Aspect Poisson Graphical Model (MAPGM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",
    "numba>=0.60",
    "numpy>=2.0",
    "pandas>=2.3",
    "scikit-learn>=1.6",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapgm"]
